[package]
name = "dashbeam-inbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "AGPL-3.0-only"
description = "Token-authorized, upload-only Dashbeam inbox"

[dependencies]
engine = { package = "sendme-native", path = "../native" }
anyhow = "1.0.75"
blake3 = "1.8.3"
clap = { version = "4.4.10", features = ["derive"] }
data-encoding = "2.8.0"
iroh = { version = "1.3.0", features = ["platform-verifier"] }
iroh-blobs = "0.103.1"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.108"
subtle = "2.6"
tempfile = "3.8.1"
tokio = { version = "1.34.0", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
